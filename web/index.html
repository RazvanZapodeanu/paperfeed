<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3e5e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a18" media="(prefers-color-scheme: dark)">
  <title>paperfeed</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/stix-two-text-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg hidden>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M7 4h10v16l-5-3.5L7 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-open" viewBox="0 0 24 24">
      <path d="M14 5h5v5M19 5l-8 8M17 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <path d="M9 9h10v10H9zM5 15V5h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-remove" viewBox="0 0 24 24">
      <path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 4v11M7 10.5l5 4.5 5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <header class="bar">
    <nav class="tabs">
      <a href="#" data-tab="deck">De citit <span class="count" data-count="deck"></span></a>
      <a href="#salvate" data-tab="saved">Salvate <span class="count" data-count="saved"></span></a>
    </nav>
  </header>
  <p class="notice" hidden></p>
  <main></main>
  <footer class="actions"></footer>
  <div class="toast" role="status" hidden></div>
</body>
</html>
